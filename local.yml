services:
  backend:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    command: bash -c "
          python manage.py migrate --no-input &&
          python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env
      - ./.envs/.local/django.env

  db:
    image: postgres:15-alpine
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.envs/.local/postgres.env
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.envs/.local/pgadmin.env
    volumes:
      - dev_pgadmin:/var/lib/pgadmin
    ports:
      - "9000:80"

  frontend:
    build:
      context: .
      dockerfile: ./compose/local/frontend/Dockerfile
    command: bash -c "npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - /app/node_modules
      - ./frontend:/app
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    env_file:
      - .env
    depends_on:
      - backend
  
  nginx:
    image: nginx:alpine
    depends_on:
      - frontend
      - backend
    volumes:      
      - ./compose/local/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/dev.crt:/etc/nginx/certs/dev.crt:ro
      - ./certs/dev.key:/etc/nginx/certs/dev.key:ro
    ports:
      - "8080:80"
      - "8443:443"


volumes:
  dev_postgres_data:
  dev_pgadmin:
