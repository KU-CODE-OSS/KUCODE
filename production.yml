services:
  backend:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    command: bash -c "
          python manage.py migrate --no-input &&
          python manage.py collectstatic --no-input &&
          gunicorn backend.wsgi:application --bind 0.0.0.0:8000
          "
    volumes:
      - static_volume:/home/app/web/static
      - media_volume:/home/app/web/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env
      - path: ./.envs/.production/django.env
        required: false

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - path: ./.envs/.production/postgres.env
        required: false
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    build:
      context: .
      dockerfile: ./compose/production/nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/home/app/web/static
      - media_volume:/home/app/web/media
      - ./certs/prod.crt:/etc/nginx/certs/prod.crt:ro
      - ./certs/prod.key:/etc/nginx/certs/prod.key:ro
    environment:
      - NODE_ENV=production
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume:
  media_volume:
